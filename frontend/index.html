<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bananaverso</title>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Cormorant+Garamond:ital,wght@1,600&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<section id="intro" class="screen on">
  <div class="bgi cover" id="introbg"></div>
  <h1>Bananaverso</h1>
  <p>Uma história sobre fome, uma banana e um macaco chamado Bento.</p>
  <button class="btn" id="watch">Assistir à história</button>
  <button class="ghost" id="skipIntro">Ir direto ao jogo</button>
</section>

<section id="cine" class="screen">
  <div class="shot" id="shA"></div>
  <div class="shot" id="shB"></div>
  <div id="vig"></div><div id="grain"></div>
  <div class="lb t"></div><div class="lb b"></div>
  <div id="sub"></div>
  <div class="ctl"><button class="ghost" id="mute">Som: ligado</button><button class="ghost" id="skip">Pular</button></div>
</section>

<section id="title" class="screen">
  <h1>Bananaverso</h1>
  <p>Proteja a banana. Alimente a floresta.</p>
  <form class="name" id="nameForm" novalidate>
    <input id="username" maxlength="20" autocomplete="nickname" placeholder="Seu nome" aria-label="Seu nome de jogador">
    <small id="nameErr" role="alert"></small>
    <button class="btn" id="play" type="submit">Jogar</button>
  </form>
  <div class="rank panel" id="rankTitle"></div>
</section>

<section id="game" class="screen">
  <div class="gb" id="gb1"></div><div class="gb" id="gb2"></div>
  <div id="hud" class="panel"><h1 id="lvlname" class="big"></h1><span id="coins"></span></div>
  <div id="bars" class="panel">
    <div><div class="lab"><span>Colheita</span><span id="plab"></span></div><div class="bar" id="prog"><i></i></div></div>
    <div><div class="lab"><span>Tempo até o Bento chegar</span><span id="tlab"></span></div><div class="bar" id="time"><i></i></div></div>
  </div>
  <div id="stage">
    <div id="msg"></div>
    <button id="banana" tabindex="-1" aria-label="Clicar na banana"><img id="bimg" alt="Banana"></button>
    <div id="mshadow"></div>
    <div id="monkey"><img id="mk0" alt=""><img id="mk1" alt=""><img id="mk2" alt="Bento, o macaco"></div>
  </div>
  <div id="shop"></div>
</section>

<section id="end" class="screen cover">
  <img id="eimg" alt="">
  <h2 id="etitle"></h2>
  <p id="etext"></p>
  <button class="btn" id="ebtn"></button>
  <div class="rank panel" id="rankEnd"></div>
</section>

<script src="game.js"></script>
</body>
</html>
